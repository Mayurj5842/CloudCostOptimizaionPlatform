spring:
  devtoolsv:
    restart:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/cloudcost_ai
    username: postgres
    password: root 

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    validate-on-migrate: false

logging:
  level:
    root: INFO