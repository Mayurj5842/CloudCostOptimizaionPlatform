spring:
  application:
    name: cloudcost-ai-backend

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  profiles:
    active: dev

server:
  port: ${PORT:8080}

# Live Cost Explorer API calls may incur AWS charges.
billing:
  cost-explorer:
    enabled: true
  sync:
    enabled: ${AWS_BILLING_IMPORT_ENABLED:true}
    interval-hours: ${AWS_BILLING_IMPORT_INTERVAL_HOURS:24}

aws:
  billing:
    region: ${AWS_BILLING_REGION:us-east-1}
    s3:
      bucket: ${AWS_BILLING_S3_BUCKET:}
      prefix: ${AWS_BILLING_S3_PREFIX:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:}